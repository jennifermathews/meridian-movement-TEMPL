<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Abstract figure in motion -->
  <g transform="translate(20, 10)">
    <!-- Head -->
    <circle cx="42" cy="18" r="10" fill="#0891b2"/>
    
    <!-- Body in dynamic stride pose -->
    <path d="M42 28 C42 28, 38 45, 35 55 C33 60, 28 72, 24 80 C22 84, 20 88, 18 92" 
          stroke="#0891b2" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Back leg -->
    <path d="M35 55 C38 62, 44 72, 50 80 C53 85, 56 90, 58 94" 
          stroke="#0891b2" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Leading arm reaching forward -->
    <path d="M40 38 C45 35, 52 32, 60 30 C65 29, 68 28, 72 28" 
          stroke="#0891b2" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Trailing arm -->
    <path d="M40 40 C36 42, 30 44, 24 42 C20 41, 16 39, 14 38" 
          stroke="#0891b2" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    
    <!-- Flowing meridian/wave lines suggesting energy and coastal movement -->
    <path d="M60 15 C68 12, 76 18, 84 15 C92 12, 100 18, 108 15" 
          stroke="#d4a843" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M55 25 C63 22, 71 28, 79 25 C87 22, 95 28, 103 25 C111 22, 119 28, 127 25" 
          stroke="#0891b2" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M58 35 C66 32, 74 38, 82 35 C90 32, 98 38, 106 35 C114 32, 122 38, 130 35" 
          stroke="#0891b2" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
    
    <!-- Gold accent arc suggesting healing/wholeness -->
    <path d="M30 5 C50 -2, 70 -2, 80 8" 
          stroke="#d4a843" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Text: Meridian Movement -->
  <text x="155" y="48" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="26" font-weight="600" letter-spacing="1" fill="#0891b2">
    MERIDIAN
  </text>
  <text x="155" y="74" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="20" font-weight="300" letter-spacing="3" fill="#0891b2">
    MOVEMENT
  </text>
  
  <!-- Subtext: Physical Therapy -->
  <text x="155" y="98" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="11" font-weight="400" letter-spacing="4" fill="#64748b">
    PHYSICAL THERAPY
  </text>
  
  <!-- Thin separator line -->
  <line x1="155" y1="82" x2="370" y2="82" stroke="#d4a843" stroke-width="1" opacity="0.6"/>
  
  <!-- Naples, FL identifier -->
  <text x="310" y="98" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="9" font-weight="400" letter-spacing="2" fill="#94a3b8">
    NAPLES, FL
  </text>
</svg>
