<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Simplified mark: abstract figure + meridian wave for favicon -->
  
  <!-- Head -->
  <circle cx="12" cy="6" r="3.5" fill="#0891b2"/>
  
  <!-- Body in motion - simplified -->
  <path d="M12 9.5 C12 9.5, 11 14, 10 17 C9.5 19, 8.5 22, 7.5 25" 
        stroke="#0891b2" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Front leg -->
  <path d="M10 17 C11 20, 13 23, 15 25.5" 
        stroke="#0891b2" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Leading arm -->
  <path d="M11.5 12 C13.5 11, 16 10, 18.5 10" 
        stroke="#0891b2" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Back arm -->
  <path d="M11.5 12.5 C10 13, 8 13.5, 6 13" 
        stroke="#0891b2" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Meridian wave lines -->
  <path d="M18 5 C21 3.5, 24 6.5, 27 5" 
        stroke="#d4a843" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M17 10 C20 8.5, 23 11.5, 26 10 C29 8.5, 30 11, 31 10" 
        stroke="#0891b2" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  
  <!-- Gold healing arc -->
  <path d="M8 3 C12 0.5, 17 1, 20 4" 
        stroke="#d4a843" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
</svg>
